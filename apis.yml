name: TawkitAI
description: >-
  CopilotKit (built by TawkitAI Inc., a Techstars Seattle '23 company) is an
  open-source, enterprise-grade agentic frontend framework for embedding AI
  copilots and agents directly into web and mobile applications. It provides
  React, Angular, Vue and React Native SDKs, prebuilt and headless chat UI
  components (CopilotChat, CopilotSidebar, CopilotPopup, CopilotTextarea), a
  GraphQL-based Copilot Runtime, a Python agent SDK, and the AG-UI protocol — a
  bi-directional connection between a user-facing app and any agentic backend
  (LangGraph, CrewAI, PydanticAI, Mastra, AWS Strands and others). Copilot Cloud
  is the hosted platform, adding thread and state persistence, generative UI,
  and multi-channel delivery across web, mobile, Slack, Teams and WhatsApp. The
  core is MIT-licensed (github.com/CopilotKit/CopilotKit, ~34.5k stars).
